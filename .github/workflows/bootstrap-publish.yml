name: Bootstrap npm publish (one-time)

# ONE-TIME manual publish that CREATES @dcl/creators-site on npm, to be deleted right after.
#
# npm Trusted Publishing (OIDC) cannot publish a package that does not exist yet: the trusted
# publisher is configured on an already-published package, so the first version goes up with a
# token. `npm publish` runs directly here because the release action swallows npm's error output.
# After it succeeds:
#   1. On npmjs.com → @dcl/creators-site → Settings → Trusted Publisher → GitHub Actions, point it
#      at this repo + build-release.yml.
#   2. Drop NPM_TOKEN from build-release.yml (OIDC takes over) and delete this workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (creates @dcl/creators-site at this version)'
        required: true
        default: '0.0.1'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Set version
        # Through env, not interpolated into the script, so the input can't inject shell.
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        # CI=true makes prebuild bake the versioned CDN base in, so this version is servable.
        run: npm run build
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=6144'

      - name: Drop any source maps
        run: find dist -name '*.map' -delete

      - name: Publish to npm
        working-directory: dist
        # --loglevel error keeps the tarball listing out of the log so the real error is readable.
        run: npm publish --access public --loglevel error
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
