name: Set rollout

# Fires after the CDN deploy (GitLab) reports success and rolls the new version out to zone and today.
# Production is deliberately NOT here: a push to main must not reach creators on its own. Promote to
# .org by hand with set-rollout-manual.yml.
#
# The CDN deploy fires for EVERY publish, manual branch deploys included, and its `ref` is the commit
# sha, not a branch. Only builds of main (pushes and releases cut from it) are rolled out here; a manual
# branch deploy is rolled out by its own run of build-release.yml, to the environment and percentage the
# dispatcher chose, and must not be overridden at 100% on both domains.
on: [deployment_status]

permissions:
  contents: read

jobs:
  set-rollout:
    if: ${{ github.event.deployment.task == 'upload-to-cdn' && github.event.deployment_status.state == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # set-rollout-action records the rollout as a GitHub deployment.
      deployments: write
    steps:
      - name: Only roll out builds of main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          # `behind`/`identical`: the sha is already part of main. `ahead`/`diverged`: a branch build.
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SHA}" --jq '.status')
          echo "compare main...${SHA}: ${status}"
          if [ "${status}" = "behind" ] || [ "${status}" = "identical" ]; then
            echo "auto=true" >> "$GITHUB_OUTPUT"
          else
            echo "auto=false" >> "$GITHUB_OUTPUT"
            echo "Not a build of main; leaving the rollout to the run that published it."
          fi

      - name: Set Rollout - zone
        if: steps.gate.outputs.auto == 'true'
        uses: decentraland/set-rollout-action@26ead404b6944fd0ce0d087cc59fd817607454d6 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.deployment.ref }}
          sha: ${{ github.event.deployment.sha }}
          packageName: ${{ github.event.deployment.payload.packageName }}
          packageVersion: ${{ github.event.deployment.payload.packageVersion }}
          deploymentPath: 'create'
          deploymentEnvironment: 'zone'
          deploymentName: '_site'
          percentage: 100

      - name: Set Rollout - today
        if: steps.gate.outputs.auto == 'true'
        uses: decentraland/set-rollout-action@26ead404b6944fd0ce0d087cc59fd817607454d6 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.deployment.ref }}
          sha: ${{ github.event.deployment.sha }}
          packageName: ${{ github.event.deployment.payload.packageName }}
          packageVersion: ${{ github.event.deployment.payload.packageVersion }}
          deploymentPath: 'create'
          deploymentEnvironment: 'today'
          deploymentName: '_site'
          percentage: 100
