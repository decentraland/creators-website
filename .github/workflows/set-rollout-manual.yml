name: Set rollout - Manual

# Points a domain at an ALREADY-PUBLISHED version of @dcl/wemotes-builder-site. Nothing is built here:
# the version must exist on the CDN, which is what makes this the way to promote the build that has been
# running on .today to .org — the same bytes, not a fresh build nobody has looked at. The percentage is
# an input so a production rollout can start small and be raised.
on:
  workflow_dispatch:
    inputs:
      packageVersion:
        description: 'Published npm version of @dcl/wemotes-builder-site to roll out (e.g. 1.4.0)'
        required: true
        default: ''
      deploymentEnvironment:
        type: choice
        description: 'Domain to point at that version'
        required: true
        # Defaults to the harmless one: reaching production takes a deliberate change of this field.
        default: 'zone'
        options:
          - zone
          - today
          - org
      rolloutPercentage:
        description: 'Percentage of traffic to serve this version to'
        required: true
        default: '100'

permissions:
  contents: read

jobs:
  set-manual-by-path-rollout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # set-rollout-action records the rollout as a GitHub deployment.
      deployments: write
    steps:
      - name: Set Rollout
        uses: decentraland/set-rollout-action@26ead404b6944fd0ce0d087cc59fd817607454d6 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          sha: ${{ github.sha }}
          packageName: '@dcl/wemotes-builder-site'
          packageVersion: ${{ github.event.inputs.packageVersion }}
          deploymentPath: 'collections'
          deploymentEnvironment: ${{ github.event.inputs.deploymentEnvironment }}
          deploymentName: '_site'
          percentage: ${{ github.event.inputs.rolloutPercentage }}
