name: Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

# Least privilege: PR jobs run code from the PR branch, so the token they hold must not be able to write.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # lint-action reports its results as a check run on the PR.
      checks: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Keep the token out of .git/config: nothing in this job pushes.
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        # Lifecycle scripts come from the PR's package.json and its dependencies; the browser bundle needs none of them.
        run: npm ci --ignore-scripts

      - name: Lint
        uses: wearerequired/lint-action@124229c6e2974984ba137c67a499ba28bfc33e33 # v3.0.2
        with:
          prettier: true
          prettier_extensions: ts,tsx,js,jsx,json,md,mdx,css
          continue_on_error: false
          eslint: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
