name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # pull-request.yml's lint-action annotates PRs to main only; these also gate pushes to main,
      # stacked PRs and reopened PRs, and the Prettier check covers html/cjs/mjs too.
      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

  # Each spec drives a whole Chrome, so the suite is CPU-bound: it is sharded across runners rather than
  # parallelised within one. No build: the harness serves the app from a Vite dev server.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every shard reports, so a red run says which slice failed.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # --ignore-scripts skips Puppeteer's own browser download.
      - name: Cache Chrome
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chrome
        run: npx puppeteer browsers install chrome

      - name: E2E tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

  # One check for branch protection: green only when every job above is, whatever the shard count.
  ci:
    name: test + e2e
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: always()
    steps:
      - name: Verify every job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "test: ${{ needs.test.result }}, e2e: ${{ needs.e2e.result }}"
            exit 1
          fi
