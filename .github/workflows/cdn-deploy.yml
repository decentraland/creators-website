name: CDN deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment to promote to'
        required: true
        default: 'today'
        # zone and today only. definitions gives @dcl/creators-site those two domains, and the
        # broker refuses a rollout to an environment outside a package's domain-derived set —
        # offering org here would produce a job that always fails. Add org alongside the .org
        # launch, when definitions gains the domain and the repository gains the environment.
        options: [zone, today]
      version:
        description: 'Version to put live, e.g. 0.0.3-36712345678.commit-1509d74 — copy it from the deploy run you want.'
        required: true
      percentage:
        description: 'Rollout percentage'
        required: true
        default: '100'

jobs:
  dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scoped to pushes. The broker serialises the KV write itself -- it holds a lease per
    # environment and record, and answers `rollout_in_progress` with a Retry-After that this
    # action retries -- so a release or a promotion may run alongside this one. Sharing a
    # single group across all three instead lets a queued release be cancelled outright by
    # the next push, which deploys nothing and reports no failure.
    #
    # Within this group a newer commit does supersede a pending older one, which is the
    # commit that should end up live.
    concurrency:
      group: cdn-deploy-${{ github.repository }}-push
      cancel-in-progress: false
    # zone and today, which is what the `set-rollout` workflow this replaces did for every
    # build of main. `today` needs an environment claim, and GitHub issues one only to a job
    # that declares an environment; `zone` needs none, so this one declaration covers both.
    #
    # GitHub evaluates this before the job starts. `today` carries no protection rules and no
    # deployment branch policy, so nothing waits -- but adding required reviewers to it would
    # make every push to main queue for approval.
    environment: today
    env:
      # Job level, not step level: the build runs inside a composite action, and composite
      # steps do not inherit `env:` from the step that calls them. All four are what the
      # `Build` step of the workflow this replaces set.
      NODE_OPTIONS: '--max-old-space-size=6144'
      # Source maps for Sentry. This is the build that produces the bundle creators run, so it
      # is the only place its maps can come from. vite.config gates the whole thing on the
      # token: it turns `build.sourcemap` on, uploads under the same release name the runtime
      # reports, then DELETES the .map files so they never reach the CDN. An absent or empty
      # secret leaves the build emitting no maps at all.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # Not secrets — the slugs in every Sentry URL for this app. The project is the LEGACY
      # BUILDER's: this app shares its Sentry project (same SENTRY_DSN in src/config/env/*.json).
      SENTRY_ORG: decentraland
      SENTRY_PROJECT: builder
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Keep the token out of .git/config: nothing in this job pushes. The action reads the
          # repository's releases through `github.token`, which it passes itself.
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        # --ignore-scripts and the Sentry upload coexist: sentry-cli's binary comes from the
        # @sentry/cli-<platform> optional package in the lockfile, not from its postinstall.
        run: npm ci --ignore-scripts
        env:
          # A step value beats the job value. The token belongs to the build and nothing else;
          # at job level it would also be readable by every dependency's install scripts.
          SENTRY_AUTH_TOKEN: ''
      # The build runs INSIDE the action, which is what keeps the version the bytes were built
      # for and the prefix they are uploaded to the same value. scripts/prebuild.cjs derives
      # VITE_BASE_URL -- the CDN path every asset is requested from, which vite.config.ts reads
      # as `base` -- from the version in package.json, which the action writes before the build
      # starts. A build that runs before the version is settled emits HTML pointing at a prefix
      # nothing was ever uploaded to.
      #
      # The `find` is belt and braces, and it runs inside `build-command` because the action
      # uploads dist itself: the Sentry plugin already deletes the maps as soon as it has
      # uploaded them, and fails the build if that upload fails. This guarantees a .map can
      # never reach the CDN even if that ever changes.
      #
      # `package-name` is not passed: the root package.json is already `@dcl/creators-site`,
      # which is what definitions binds to this repository.
      - uses: decentraland/actions/cdn-deploy@cdn-deploy-v1
        with:
          build-command: |
            npm run build
            find dist -name '*.map' -delete
          dist-path: ./dist
          deployment-environments: '["zone","today"]'

  release:
    # `release: published` fires for prereleases too. Without the guard an RC would publish
    # like any other release.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keyed by tag: two releases published close together both deploy, rather than the pending
    # one being cancelled when the second arrives.
    concurrency:
      group: cdn-deploy-${{ github.repository }}-release-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    environment: today
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: decentraland
      SENTRY_PROJECT: builder
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
        env:
          SENTRY_AUTH_TOKEN: ''
      # Rebuilt rather than copied from the commit build: prebuild bakes VITE_BASE_URL from the
      # version, so a copy of the commit build would serve /1.0.0/index.html asking for its
      # assets from /1.0.0-<runId>.commit-<sha7>/. A release serves everything from its own
      # path, which means building with the tag as the version -- which is what passing
      # `version` alongside `build-command` does.
      #
      # The Sentry release name is `creators-website@<package.json version>`, derived in
      # vite.config from the version the action has just written, so a release's maps are
      # uploaded under the tag and match what its runtime reports.
      - uses: decentraland/actions/cdn-deploy@cdn-deploy-v1
        with:
          build-command: |
            npm run build
            find dist -name '*.map' -delete
          dist-path: ./dist
          version: ${{ github.event.release.tag_name }}
          deployment-environments: '["zone","today"]'

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Keyed by environment: a promotion to zone must not queue behind one to today.
    concurrency:
      group: cdn-deploy-${{ github.repository }}-promote-${{ inputs.environment }}
      cancel-in-progress: false
    # Required: GitHub evaluates this before the job starts and only then issues the
    # environment claim the broker checks for today.
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
      deployments: write
      statuses: write
    steps:
      # No checkout: nothing is built and the bytes are already in S3, so the package name
      # cannot be read from package.json, and there is no base version to compute a commit
      # version from -- the action only demands one when it has to compute it.
      #
      # One dispatch is NOT a rollback. Records are stored sorted descending by semver and
      # the worker serves the first one whose percentage covers the user, so EVERY version
      # that sorts above the target has to be at 0% before the target is reached -- after a
      # few pushes that is several commit builds, not one.
      #
      # The order matters. Restore the target to 100% FIRST, then zero the abandoned
      # versions from the top down: at no point is there a gap where a record below the
      # target serves. Zeroing first opens exactly that gap.
      #
      # One dispatch at a time, waiting for each run to finish. These share a concurrency
      # group per environment, and a third dispatch queued behind a running one cancels the
      # second while it is still pending -- which deploys nothing and reports no failure.
      #
      # A version published before this workflow existed has no `.deploy-complete.json`, and
      # the broker refuses to point at a prefix whose upload it cannot confirm finished. Use
      # `set-rollout-manual.yml` for those; it writes KV through the older path, which does not check.
      - uses: decentraland/actions/cdn-deploy@cdn-deploy-v1
        with:
          package-name: '@dcl/creators-site'
          version: ${{ inputs.version }}
          deployment-environments: ${{ inputs.environment }}
          percentage: ${{ inputs.percentage }}
