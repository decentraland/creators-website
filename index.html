    <meta name="theme-color" content="#000000" />
    <!-- The creator home's feeds, media and analytics hosts. fetch() uses anonymous connections (crossorigin); media and beacons do not. -->
    <link rel="preconnect" href="https://realm-provider-ea.decentraland.org" crossorigin />
    <link rel="preconnect" href="https://cms-api.decentraland.org" crossorigin />
    <link rel="preconnect" href="https://images.ctfassets.net" />
    <link rel="preconnect" href="https://videos.ctfassets.net" />
    <link rel="preconnect" href="https://api.e.decentraland.org" />
    <link rel="preload" href="/src/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // The hero poster is the overview's first paint; fetch it with the bundle instead of after it. Other
      // routes never show it. The candidates mirror heroData.poster (Hero.spec checks).
      ;(function () {
        var path = location.pathname.replace(/\/+$/, "")
        if (path !== "" && path !== "/create") return
        var link = document.createElement("link")
        link.rel = "preload"
        link.as = "image"
        link.setAttribute("fetchpriority", "high")
        link.href = "%BASE_URL%overview/hero-1920.webp"
        link.setAttribute(
          "imagesrcset",
          "%BASE_URL%overview/hero-1280.webp 1280w, %BASE_URL%overview/hero-1920.webp 1920w"
        )
        link.setAttribute("imagesizes", "100vw")
        document.head.appendChild(link)
      })()
    </script>
    <title>Create in Decentraland | Wearables, Emotes, Scenes & Worlds</title>
    <meta
      name="description"
      content="Everything you need to create in Decentraland: build Wearables, Emotes, Scenes and Worlds, manage your collections and join the creator community."
